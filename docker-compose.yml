services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: portfolix_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - PORT=8000
      - HOST=0.0.0.0
      - SECRET_KEY=portfolix_super_secret_jwt_key_change_in_production_998877
      - DATABASE_URL=sqlite:///./portfolix.db
      - CORS_ORIGINS=["http://localhost", "http://localhost:5173", "http://localhost:80"]
    volumes:
      - sqlite_data:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: portfolix_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  sqlite_data:
